```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BWODITOR CLEAN</title>

<style>
html, body, canvas {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const DATA_WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";



/*
CREATE EMSCRIPTEN MODULE
*/

window.Module = {

  canvas: document.getElementById("canvas"),

  locateFile(path) {

    console.log("request:", path);

    if (path.endsWith("Data.wolf")) {
      return DATA_WOLF;
    }

    return BASE + path;
  },

  preRun: [async function() {

    /*
    CREATE GAME FOLDERS
    */

    try { FS.mkdir("/data0"); } catch(e) {}
    try { FS.mkdir("/data0/woditor-test-GameCache"); } catch(e) {}
    try { FS.mkdir("/data0/woditor-test-GameCache/Data"); } catch(e) {}



    /*
    DOWNLOAD REQUIRED FILES
    */

    async function mount(name) {

      const url = BASE + name;

      console.log("downloading", url);

      const data = await fetch(url)
        .then(r => r.arrayBuffer());

      FS.writeFile(
        "/data0/woditor-test-GameCache/Data/" + name,
        new Uint8Array(data)
      );

      console.log("mounted", name);
    }

    await mount("Game.ini");
    await mount("FontList.ini");
    await mount("DefaultFont.ttf");
    await mount("DefaultSubFont.ttf");
    await mount("DefaultSoundFont.sf2");
    await mount("InitialDownloadList.ini");



    /*
    MANUALLY DOWNLOAD DATA.WOLF
    */

    console.log("downloading Data.wolf");

    const wolfData = await fetch(DATA_WOLF)
      .then(r => r.arrayBuffer());

    FS.writeFile(
      "/data0/woditor-test-GameCache/Data/Data.wolf",
      new Uint8Array(wolfData)
    );

    console.log("mounted Data.wolf");

  }]

};

</script>

<script src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/woditor.js"></script>

</body>
</html>
```

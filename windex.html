<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BWODITOR REAL FIX</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#canvas {
  width: 100vw;
  height: 100vh;
  display: block;
  background: black;
}
</style>
</head>

<body>

<div id="title"></div>
<div id="version-short"></div>
<div id="memory-usage"></div>
<div id="title-content"></div>
<div id="main-footer"></div>

<canvas
  id="canvas"
  width="640"
  height="480"
  tabindex="-1">
</canvas>

<script>

(async function () {

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

window.Module = {

  preRun: [],

  canvas: document.getElementById("canvas"),

  locateFile(path) {

    if (path.indexOf("Data.wolf") !== -1) {
      return WOLF;
    }

    return BASE + path;
  }
};

Module.preRun.push(function () {

  try { FS.mkdir("/data0"); } catch(e) {}
  try { FS.mkdir("/data0/woditor-test-GameCache"); } catch(e) {}
  try { FS.mkdir("/data0/woditor-test-GameCache/Data"); } catch(e) {}

});

function addScript(src) {

  return new Promise(function(resolve, reject) {

    const s = document.createElement("script");

    s.src = src;

    s.onload = resolve;
    s.onerror = reject;

    document.body.appendChild(s);
  });
}

await addScript(BASE + "settings.js");
await addScript(BASE + "lib/jszip.min.js");
await addScript(BASE + "lib/hammer.min.js");

window.Module.canvas =
  document.getElementById("canvas");

await addScript(BASE + "lib/keydispatch.js");
await addScript(BASE + "lib/system.js");

async function mountFile(name) {

  const data =
    await fetch(BASE + name)
    .then(r => r.arrayBuffer());

  FS.writeFile(
    "/data0/woditor-test-GameCache/Data/" + name,
    new Uint8Array(data)
  );

  console.log("mounted", name);
}

Module.preRun.push(async function () {

  await mountFile("Game.ini");
  await mountFile("FontList.ini");
  await mountFile("DefaultFont.ttf");
  await mountFile("DefaultSubFont.ttf");
  await mountFile("DefaultSoundFont.sf2");
  await mountFile("InitialDownloadList.ini");
});

await addScript(BASE + "woditor.js");

document.body.addEventListener("click", function () {

  if (window.AL && AL.currentCtx && AL.currentCtx.audioCtx) {

    AL.currentCtx.audioCtx.resume();
  }

}, { once: true });

})();

</script>

</body>
</html>

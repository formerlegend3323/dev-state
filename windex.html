```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BWODITOR WORKING</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
</style>
</head>

<body>

<script type="module">

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

let html = await fetch(BASE + "index.html")
  .then(r => r.text());

html = html.replace(
  /<head>/i,
  `<head><base href="${BASE}">`
);

html = html.replace(
  /<script async type="text\/javascript" src="woditor\.js"><\/script>/i,
`
<script>

window.Module = window.Module || {};

Module.locateFile = function(path) {

  if (path.includes("Data.wolf")) {
    return "${WOLF}";
  }

  return "${BASE}" + path;
};

Module.preRun = Module.preRun || [];

Module.preRun.push(async function() {

  try { FS.mkdir('/data0'); } catch(e) {}
  try { FS.mkdir('/data0/woditor-test-GameCache'); } catch(e) {}
  try { FS.mkdir('/data0/woditor-test-GameCache/Data'); } catch(e) {}

  async function mount(name) {

    const data = await fetch("${BASE}" + name)
      .then(r => r.arrayBuffer());

    FS.writeFile(
      "/data0/woditor-test-GameCache/Data/" + name,
      new Uint8Array(data)
    );

    console.log("mounted", name);
  }

  await mount("Game.ini");
  await mount("FontList.ini");
  await mount("DefaultFont.ttf");
  await mount("DefaultSubFont.ttf");
  await mount("DefaultSoundFont.sf2");
  await mount("InitialDownloadList.ini");

});

<\/script>

<script async type="text/javascript" src="${BASE}woditor.js"><\/script>
`
);

document.open();
document.write(html);
document.close();

</script>

</body>
</html>

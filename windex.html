<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BWODITOR REAL FIX</title>
</head>

<body>

<script type="module">

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

/*
  FETCH ORIGINAL HTML
*/
let html =
  await fetch(BASE + "index.html")
  .then(r => r.text());

/*
  FORCE STANDARDS MODE
*/
html = html.replace(
  /<!doctype html>/i,
  "<!DOCTYPE html>"
);

/*
  BASE TAG
*/
html = html.replace(
  /<head>/i,
  `<head><base href="${BASE}">`
);

/*
  REMOVE woditor.js
*/
html = html.replace(
  /<script async type="text\/javascript" src="woditor\.js"><\/script>/i,
  ""
);

/*
  WRITE ORIGINAL PAGE
*/
document.open();
document.write(html);
document.close();

/*
  WAIT FOR ORIGINAL DOM
*/
await new Promise(r => setTimeout(r, 100));

/*
  PATCH MODULE
*/
window.Module = window.Module || {};

Module.locateFile = function(path) {

  if (path.includes("Data.wolf")) {
    return WOLF;
  }

  return BASE + path;
};

Module.preRun = Module.preRun || [];

/*
  BLOCK STARTUP
*/
Module.preRun.push(function() {

  FS.mkdir("/data0");
  FS.mkdir("/data0/woditor-test-GameCache");
  FS.mkdir("/data0/woditor-test-GameCache/Data");
});

/*
  LOAD FILES FIRST
*/
async function mount(name) {

  const data =
    await fetch(BASE + name)
    .then(r => r.arrayBuffer());

  FS.writeFile(
    "/data0/woditor-test-GameCache/Data/" + name,
    new Uint8Array(data)
  );

  console.log("mounted", name);
}

/*
  LOAD EMSCRIPTEN RUNTIME
*/
await import(BASE + "woditor.js");

/*
  NOW MOUNT FILES
*/
await mount("Game.ini");
await mount("FontList.ini");
await mount("DefaultFont.ttf");
await mount("DefaultSubFont.ttf");
await mount("DefaultSoundFont.sf2");
await mount("InitialDownloadList.ini");

console.log("READY");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BWODITOR REAL REAL FIX</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
</style>
</head>

<body>

<script>
(async () => {

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

/*
  FETCH ORIGINAL PAGE
*/
let html =
  await fetch(BASE + "index.html")
  .then(r => r.text());

/*
  FORCE STANDARDS MODE
*/
html = html.replace(
  /<!doctype html>/i,
  "<!DOCTYPE html>"
);

/*
  ADD BASE TAG
*/
html = html.replace(
  /<head>/i,
  `<head>
   <base href="${BASE}">
  `
);

/*
  PATCH ONLY Data.wolf
*/
html = html.replace(
  /<script async type="text\/javascript" src="woditor\.js"><\/script>/i,

`
<script>

window.Module = window.Module || {};

Module.locateFile = function(path) {

  if (path.indexOf("Data.wolf") !== -1) {
    return "${WOLF}";
  }

  return "${BASE}" + path;
};

</script>

<script async type="text/javascript" src="${BASE}woditor.js"></script>
`
);

/*
  REPLACE PAGE
*/
document.open();
document.write(html);
document.close();

})();
</script>

</body>
</html>

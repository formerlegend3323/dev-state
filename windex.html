<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>BWODITOR</title>

<base href="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#canvas {
  width: 100vw;
  height: 100vh;
  display: block;
  background: black;
}
</style>
</head>

<body>

<canvas
  id="canvas"
  width="640"
  height="480"
  tabindex="-1">
</canvas>

<script>

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

window.Module = {

  canvas: document.getElementById("canvas"),

  locateFile(path) {

    if (path.endsWith("Data.wolf")) {
      return WOLF;
    }

    return BASE + path;
  },

  preRun: [async function() {

    try { FS.mkdir('/data0'); } catch(e) {}

    try {
      FS.mkdir('/data0/woditor-test-GameCache');
    } catch(e) {}

    try {
      FS.mkdir('/data0/woditor-test-GameCache/Data');
    } catch(e) {}

    async function putFile(name) {

      const data = await fetch(BASE + name)
        .then(r => r.arrayBuffer());

      FS.writeFile(
        "/data0/woditor-test-GameCache/Data/" + name,
        new Uint8Array(data)
      );

      console.log("mounted", name);
    }

    await putFile("Game.ini");
    await putFile("FontList.ini");
    await putFile("DefaultFont.ttf");
    await putFile("DefaultSubFont.ttf");
    await putFile("DefaultSoundFont.sf2");
    await putFile("InitialDownloadList.ini");

  }]
};

document.body.addEventListener("click", () => {

  if (typeof AudioContext !== "undefined") {

    const ctx = new AudioContext();

    ctx.resume();
  }

}, { once: true });

</script>

<script src="lib/jszip.min.js"></script>
<script src="lib/hammer.min.js"></script>
<script src="lib/keydispatch.js"></script>
<script type="module" src="lib/benten_front.js"></script>
<script src="lib/system.js"></script>
<script async src="woditor.js"></script>

</body>
</html>

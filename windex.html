<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BWODITOR WORKING FIX</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
</style>
</head>

<body>

<div id="title"></div>
<div id="version-short"></div>
<div id="memory-usage"></div>

<canvas id="canvas"
  width="640"
  height="480"
  tabindex="-1"
  style="
    width:100vw;
    height:100vh;
    display:block;
    background:black;
  ">
</canvas>

<script>

(async function () {

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

window.Module = {

  canvas: document.getElementById("canvas"),

  locateFile(path) {

    if (path.includes("Data.wolf")) {
      return WOLF;
    }

    return BASE + path;
  },

  preRun: [async function () {

    try { FS.mkdir("/data0"); } catch(e) {}
    try { FS.mkdir("/data0/woditor-test-GameCache"); } catch(e) {}
    try { FS.mkdir("/data0/woditor-test-GameCache/Data"); } catch(e) {}

    async function putFile(name) {

      const data = await fetch(BASE + name)
        .then(r => r.arrayBuffer());

      FS.writeFile(
        "/data0/woditor-test-GameCache/Data/" + name,
        new Uint8Array(data)
      );

      console.log("mounted", name);
    }

    await putFile("Game.ini");
    await putFile("FontList.ini");
    await putFile("DefaultFont.ttf");
    await putFile("DefaultSubFont.ttf");
    await putFile("DefaultSoundFont.sf2");
    await putFile("InitialDownloadList.ini");

  }]
};

function loadScript(src) {
  return new Promise((resolve, reject) => {

    const s = document.createElement("script");

    s.src = src;

    s.onload = resolve;
    s.onerror = reject;

    document.body.appendChild(s);
  });
}

await loadScript(BASE + "settings.js");
await loadScript(BASE + "lib/jszip.min.js");
await loadScript(BASE + "lib/hammer.min.js");
await loadScript(BASE + "lib/keydispatch.js");
await loadScript(BASE + "lib/system.js");
await loadScript(BASE + "woditor.js");

})();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BWODITOR WORKING FIX</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
</style>
</head>

<body>

<div id="loading_text"></div>
<audio id="checkSound"></audio>
<canvas id="canvas"></canvas>

<script>

(async function () {

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";



/*
FIX NULL ERRORS
*/

window.Module = {
  canvas: document.getElementById("canvas")
};



/*
REDIRECT DATA.WOLF
*/

const oldFetch = window.fetch;

window.fetch = async function(resource, options) {

  let url = resource;

  if (typeof resource !== "string") {
    url = resource.url;
  }

  if (url.includes("Data.wolf")) {
    console.log("redirect fetch -> unpkg");
    resource = WOLF;
  }

  return oldFetch(resource, options);
};



/*
REDIRECT XHR
*/

const oldOpen = XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open = function(method, url) {

  if (url.includes("Data.wolf")) {

    console.log("redirect xhr -> unpkg");

    arguments[1] = WOLF;
  }

  return oldOpen.apply(this, arguments);
};



/*
EMSCRIPTEN FILE LOADER
*/

Module.locateFile = function(path) {

  if (path.endsWith("Data.wolf")) {
    return WOLF;
  }

  return BASE + path;
};



/*
PRELOAD FILES
*/

Module.preRun = Module.preRun || [];

Module.preRun.push(async function() {

  try { FS.mkdir('/data0'); } catch(e) {}
  try { FS.mkdir('/data0/woditor-test-GameCache'); } catch(e) {}
  try { FS.mkdir('/data0/woditor-test-GameCache/Data'); } catch(e) {}

  async function putFile(name) {

    const data = await fetch(BASE + name)
      .then(r => r.arrayBuffer());

    FS.writeFile(
      "/data0/woditor-test-GameCache/Data/" + name,
      new Uint8Array(data)
    );

    console.log("mounted", name);
  }

  await putFile("Game.ini");
  await putFile("FontList.ini");
  await putFile("DefaultFont.ttf");
  await putFile("DefaultSubFont.ttf");
  await putFile("DefaultSoundFont.sf2");
  await putFile("InitialDownloadList.ini");

});



/*
LOAD ORIGINAL PAGE
*/

let html = await fetch(BASE + "index.html")
  .then(r => r.text());

html = html.replace(
  /<script async type="text\/javascript" src="woditor\.js"><\/script>/i,
  ""
);

document.open();
document.write(html);
document.close();



/*
LOAD ENGINE
*/

const script = document.createElement("script");

script.src = BASE + "woditor.js";

document.body.appendChild(script);

})();

</script>

</body>
</html>

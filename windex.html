<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BWODITOR ACTUALLY FIXED</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#canvas {
  width: 100vw;
  height: 100vh;
  display: block;
  background: black;
}
</style>
</head>

<body>

<!-- REQUIRED DUMMY ELEMENTS -->
<div id="title"></div>
<div id="version-short"></div>
<div id="memory-usage"></div>
<div id="title-content"></div>
<div id="main-footer"></div>
<div id="screen-left"></div>
<div id="screen-right"></div>
<div id="outer"></div>
<div id="main"></div>

<canvas
  id="canvas"
  width="640"
  height="480"
  tabindex="-1">
</canvas>

<script>

(async () => {

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

window.WoditorGameSettings = {
  hideSideButtons: true,
  hideHeaderFooter: true,
  isFullscreen: true
};

window.Module = {
  canvas: document.getElementById("canvas"),

  locateFile(path) {

    if (path.includes("Data.wolf")) {
      return WOLF;
    }

    return BASE + path;
  },

  preRun: [],

  postRun: []
};

function loadScript(src) {

  return new Promise((resolve, reject) => {

    const s = document.createElement("script");

    s.src = src;

    s.onload = resolve;
    s.onerror = reject;

    document.body.appendChild(s);
  });
}

/* LOAD CORE LIBS */

await loadScript(BASE + "settings.js");
await loadScript(BASE + "lib/jszip.min.js");
await loadScript(BASE + "lib/hammer.min.js");

/* PREVENT keydispatch.js CRASH */

window.Module.canvas =
  document.getElementById("canvas");

/* LOAD EMSCRIPTEN SYSTEM */

await loadScript(BASE + "lib/system.js");

/* MOUNT GAME FILES */

Module.preRun.push(async () => {

  try { FS.mkdir("/data0"); } catch(e) {}

  try {
    FS.mkdir("/data0/woditor-test-GameCache");
  } catch(e) {}

  try {
    FS.mkdir("/data0/woditor-test-GameCache/Data");
  } catch(e) {}

  async function mount(name) {

    const data =
      await fetch(BASE + name)
      .then(r => r.arrayBuffer());

    FS.writeFile(
      "/data0/woditor-test-GameCache/Data/" + name,
      new Uint8Array(data)
    );

    console.log("mounted", name);
  }

  await mount("Game.ini");
  await mount("FontList.ini");
  await mount("DefaultFont.ttf");
  await mount("DefaultSubFont.ttf");
  await mount("DefaultSoundFont.sf2");
  await mount("InitialDownloadList.ini");

});

/* DISABLE BROKEN MOBILE INPUTS */

window.dispatchKeyCode = function(){};
window.dispatchDirKeyWithDelta = function(){};
window.cancelAllDirKeyCodes = function(){};

/* LOAD GAME */

await loadScript(BASE + "woditor.js");

/* AUDIO FIX */

document.body.addEventListener(
  "click",
  async () => {

    try {

      if (
        window.AL &&
        AL.currentCtx &&
        AL.currentCtx.audioCtx
      ) {
        await AL.currentCtx.audioCtx.resume();
      }

    } catch(e) {
      console.log(e);
    }

  },
  { once: true }
);

})();

</script>

</body>
</html>

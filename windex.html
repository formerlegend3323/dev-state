<!doctype html>
<html lang="ja-JP">

<head>
<meta charset="utf-8">

<base href="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />

<meta name="mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Browser Woditor</title>

<style>

body {
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#canvas {
  width: 100%;
  height: 100%;
  background: #333;
}

</style>
</head>

<body>

<div id="outer">

<div id="container">

<div id="screen-holder-left">
<div id="screen-left">

<div id="left-content">
<div id="right-hold"></div>
<div id="move-axis"></div>
</div>

</div>
</div>

<div id="screen-holder-main">

<div id="main">

<div id="screen">

<div id="main-header">
<div id="title-content">
<p id="title"></p>
</div>
</div>

<div id="main-content">

<button id="settings"></button>

<canvas
id="canvas"
width="640"
height="480"
tabindex="-1">
</canvas>

<input
id="textinput"
type="text"
hidden>

<p id="touchtostart"></p>

</div>

<div id="main-footer">

<div id="main-footer-links">

<div id="version-short">
[BW ver dummy]
</div>

<div id="memory-usage">
已用运存:0MB
</div>

</div>

</div>

</div>

</div>

</div>

<div id="screen-holder-right">

<div id="screen-right">

<div class="right-content">

<div id="shift"></div>
<div id="esc"></div>
<div id="enter"></div>

</div>

</div>

</div>

</div>

</div>

<script>

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

window.Module = {

canvas: document.getElementById("canvas"),

locateFile(path) {

  if (path.endsWith("Data.wolf")) {
    return WOLF;
  }

  return path;
}

};

document.body.addEventListener("click", async () => {

  try {

    const ctx = new AudioContext();

    await ctx.resume();

  } catch(e) {}

}, { once:true });

</script>

<script type="text/javascript" src="settings.js"></script>
<script type="text/javascript" src="lib/jszip.min.js"></script>
<script type="text/javascript" src="lib/hammer.min.js"></script>
<script type="text/javascript" src="lib/keydispatch.js"></script>

<script type="module" src="lib/benten_front.js"></script>
<script type="text/javascript" src="lib/system.js"></script>
<script async type="text/javascript" src="woditor.js"></script>

</body>
</html>

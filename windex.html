<!doctype html>
<html lang="ja-JP">

<head>
<meta charset="utf-8">

<base href="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />

<title>BWODITOR</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #333;
}

</style>
</head>

<body>

<audio
id="sound"
src="assets/sample.wav"
preload="auto"
hidden>
</audio>

<div id="error-log"></div>
<div id="popup"></div>
<div id="bwoditorerror"></div>

<p id="title"></p>

<div id="memory-usage"></div>

<div id="screen-left"></div>
<div id="screen-right"></div>

<div id="settings"></div>

<div id="move-axis"></div>
<div id="right-hold"></div>

<div id="shift"></div>
<div id="esc"></div>
<div id="enter"></div>

<div id="version-short"></div>

<input id="textinput" hidden>

<p id="touchtostart"></p>

<canvas
id="canvas"
width="640"
height="480"
tabindex="-1">
</canvas>

<script>

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

window.Module = {

canvas: document.getElementById("canvas"),

locateFile(path) {

  if (path.includes("Data.wolf")) {
    return WOLF;
  }

  return BASE + path;
},

preRun: [function() {

  try { FS.mkdir("/data0"); } catch(e) {}

  try { FS.mkdir("/data0/woditor-test-GameCache"); } catch(e) {}

  try { FS.mkdir("/data0/woditor-test-GameCache/Data"); } catch(e) {}

}]

};

document.body.addEventListener("click", async () => {

  try {

    const ctx = new AudioContext();

    await ctx.resume();

    const audio = document.getElementById("sound");

    if (audio) {
      audio.play().catch(() => {});
    }

  } catch(e) {}

}, { once:true });

</script>

<script src="settings.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/hammer.min.js"></script>
<script src="lib/keydispatch.js"></script>

<script type="module" src="lib/benten_front.js"></script>
<script src="lib/system.js"></script>
<script async src="woditor.js"></script>

</body>
</html>

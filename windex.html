<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BWODITOR WORKING</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

iframe {
  border: 0;
  width: 100%;
  height: 100%;
}

#startOverlay {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-size: 24px;
  z-index: 9999;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="startOverlay">
  CLICK TO START
</div>

<iframe id="game"></iframe>

<script type="module">

const BASE =
"https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/";

const WOLF =
"https://unpkg.com/bwoditor-web@1.0.0/assets/public/Data.wolf";

const overlay = document.getElementById("startOverlay");

overlay.onclick = async () => {

  overlay.remove();

  let html = await fetch(BASE + "index.html")
    .then(r => r.text());

  /*
    Ensure standards mode
  */
  if (!html.toLowerCase().includes("<!doctype")) {
    html = "<!DOCTYPE html>\n" + html;
  }

  /*
    Force proper base URL
  */
  html = html.replace(
    /<head>/i,
    `<head>
      <base href="${BASE}">
      <meta charset="utf-8">
    `
  );

  /*
    Replace woditor.js loader
  */
  html = html.replace(
    /<script async type="text\/javascript" src="woditor\.js"><\/script>/i,

`
<script>

window.Module = window.Module || {};

Module.locateFile = function(path) {

  if (path.includes("Data.wolf")) {
    return "${WOLF}";
  }

  return "${BASE}" + path;
};

Module.preRun = Module.preRun || [];

Module.preRun.push(function() {

  console.log("PRE-RUN START");

  /*
    Create directories safely
  */
  FS.createPath("/", "data0", true, true);
  FS.createPath("/data0", "woditor-test-GameCache", true, true);
  FS.createPath(
    "/data0/woditor-test-GameCache",
    "Data",
    true,
    true
  );

});

Module.onRuntimeInitialized = async function() {

  console.log("RUNTIME READY");

  async function mount(name) {

    const data = await fetch("${BASE}" + name)
      .then(r => r.arrayBuffer());

    const path =
      "/data0/woditor-test-GameCache/Data/" + name;

    FS.writeFile(
      path,
      new Uint8Array(data)
    );

    console.log("mounted", name);
  }

  await mount("Game.ini");
  await mount("FontList.ini");
  await mount("DefaultFont.ttf");
  await mount("DefaultSubFont.ttf");
  await mount("DefaultSoundFont.sf2");
  await mount("InitialDownloadList.ini");

  console.log("ALL FILES MOUNTED");
};

<\/script>

<script async type="text/javascript" src="${BASE}woditor.js"><\/script>
`
  );

  /*
    Load into iframe instead of document.write
  */
  const iframe = document.getElementById("game");

  iframe.srcdoc = html;

};

</script>

</body>
</html>

<!doctype html>
<html lang="ja-JP">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />

  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-status-bar-style" content="black-translucent"/>

  <title>Browser Woditor</title>

  <style>
    body {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }

    #outer, #container {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: grid;
    }

    #canvas {
      width: 100%;
      height: 100%;
      background: #333;
      outline: none;
    }
  </style>
</head>

<body>

  <audio id="sound" src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/sample.wav" hidden></audio>

  <div id="outer">
    <div id="container">

      <div id="screen-holder-main">
        <canvas id="canvas" width="640" height="480" data-webgl2="true"></canvas>

        <button id="settings"></button>

        <input id="textinput" type="text" hidden />
      </div>

    </div>
  </div>

  <!-- ===================== -->
  <!-- CDN ONLY SCRIPT LOADS -->
  <!-- ===================== -->

  <script>
    const CDN = "https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/lib/keydispatch.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/lib/system.js"></script>

  <script type="module"
    src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/lib/benten_front.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/woditor.js"></script>

</body>
</html>

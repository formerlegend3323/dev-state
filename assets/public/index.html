```html
<!doctype html>
<html lang="ja-JP">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />

  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-status-bar-style" content="black-translucent"/>

  <title>Browser Woditor</title>

  <style>

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;

      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    a {
      color: #fff;
    }

    a:visited {
      color: #ddd;
    }

    #outer{
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      justify-items: center;
      align-items: center;
      text-align: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #container {
      display: grid;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      width: 100dvw;
      overflow: hidden;

      grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr);
      grid-template-rows: 1fr 0.01fr;
    }

    #screen-holder-left,
    #screen-holder-main,
    #screen-holder-right {
      flex: 1;
      overflow: hidden;
      margin: 2px;
    }

    #screen-holder-left,
    #screen-holder-right{
      display: flex;
      height: 100%;
    }

    .screen-side {
      flex: auto;
    }

    .side-content{
      height: 100%;
    }

    #main{
      height: 100%;
      display: grid;
      grid-template-columns: 100%;
      grid-template-rows: 1fr auto 1fr;
    }

    #screen {
      display: grid;
      grid-template-columns: 100%;
      grid-template-rows: 1fr auto 1fr;
    }

    #main-header {
      display: flex;
      align-items: center;
    }

    #main-content{
      position: relative;
      display: flex;
      justify-items: center;
      align-items: center;
    }

    #main-footer {
      height: 5vmin;
      height: 5dvmin;
      font-size: 2vmin;
      font-size: 2dvmin;
      text-align: center;
    }

    #main-footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #title-content {
      height: 5vmin;
      height: 5dvmin;
      margin: 0;
      margin-left: 24px;
      font-size: 2vmin;
      font-size: 2dvmin;
    }

    #canvas {
      width: auto;
      height: 100vh;
      height: 100dvh;
      border: 0;
      outline: none;

      position: relative;
      left: 50%;
      top: 50%;
      translate: -50% -50%;

      background-color: #333333ff;

      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/bwoditor.svg");
      background-repeat: no-repeat;
      background-size: 40%;
      background-position: center;
    }

    .itemh {
      box-sizing: border-box;
      border: 1px solid darkslategray;
      border-radius: 7px;

      display: grid;
      align-items: center;
      text-align: center;

      font-size: 2.5vh;

      background-color: whitesmoke;

      cursor: pointer;

      -webkit-user-select: none;
      user-select: none;
    }

    #right-hold{
      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/righthold.png");
      background-repeat: no-repeat;
      background-size: 6vw;
      background-position: center;
    }

    #move-axis{
      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/moveaxis.png");
      background-repeat: no-repeat;
      background-size: 6vw;
      background-position: center;
    }

    #enter{
      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/enter.png");
      background-repeat: no-repeat;
      background-size: 6vw;
      background-position: center;
    }

    #esc{
      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/esc.png");
      background-repeat: no-repeat;
      background-size: 6vw;
      background-position: center;
    }

    #shift{
      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/shift.png");
      background-repeat: no-repeat;
      background-size: 6vw;
      background-position: center;
    }

    #settings {
      min-width: 8vmin;
      min-height: 8vmin;

      position: fixed;
      top: 0;
      left: 0;

      padding: 10px;

      background-color: rgba(175, 175, 175, 0.562);

      border: none;
      border-radius: 5px;

      cursor: move;

      z-index: 1000;

      background-image: url("https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/img/setting.png");
      background-repeat: no-repeat;
      background-size: 5vmin;
      background-position: center;
    }

    .sub-button{
      border: solid;
      border-width: 1px;
      font-size: 3vmin;
      margin: 2px;
      padding: 3px;
    }

    #popup {
      height: auto;
      padding: 1vw;

      max-width: 50vmin;
      min-width: 50vmin;

      margin-left: -25vmin;

      background-color: #444;
      color: #fff;

      text-align: center;

      border-radius: 2px;

      position: fixed;
      z-index: 1;

      left: 50%;
      top: 30px;

      font-size: 3vmin;
    }

    #instructions {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      background-color: rgba(0, 0, 0, 0.5);

      z-index: 1000;

      display: none;
    }

    #instructions:not([hidden]) {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .instructions-content {
      background-color: white;
      padding: 20px;

      border-radius: 5px;

      width: 80%;
      max-width: 600px;
      max-height: 80vh;

      box-shadow: 0 0 10px rgba(0,0,0,0.3);

      position: relative;

      display: flex;
      flex-direction: column;

      overflow-y: auto;
    }

    .close-button {
      position: absolute;
      top: 10px;

      font-size: 24px;

      cursor: pointer;
    }

      position:absolute;
      left: 0;
      top: 80%;
      width: 100%;
      color: white;
      font-size: 3vmin;
    }

    @media (max-aspect-ratio: 3.5/4) {

      #container {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr 0.05fr;
      }

      #screen-holder-left {
        order: 2;

      #screen-holder-main {
        order: 1;

      }

      #screen-holder-right {
        order: 3;
      }

      #canvas {
        width: 100vw;
        width: 100dvw;
        height: auto;
      }
    }

  </style>
</head>

<body>

  <div id="toast"></div>

  <div id="outer">

    <div id="container">

        <div class="screen-side" id="screen-left">

          <div class="side-content" id="left-content">

        </div>

      </div>

        <div id="main">

          <div class="padding"></div>

          <div id="screen">

            <div id="main-header">

              <div id="title-content">

              </div>

            </div>

            <div id="main-content">

                    <input

                </div>

              </div>

                id="settings"

              </button>

              </canvas>

                tabindex="1"
                hidden=true>

              <p id="touchtostart"></p>

            </div>

            <div id="main-footer">

              <div id="main-footer-links">

                <div id="version-short" style="margin-right: 5px;">
                  [BW ver dummy]
                </div>

                <div id="memory-usage" style="margin-left: 5px;">
                  已用运存:0MB
                </div>

              </div>

            </div>

          </div>

          <div class="padding"></div>

        </div>

      </div>

      <div id="screen-holder-right">

        <div class="screen-side" id="screen-right">

          <div class="side-content right-content">

            <div
              id="shift"
              class="itemh"
              style="width: 100%; height: 30%;">
            </div>

            <div
              id="esc"
              class="itemh"
              style="width: 100%; height: 30%;">
            </div>

            <div
              id="enter"
              class="itemh"
              style="width: 100%; height: 40%;">
            </div>

          </div>

        </div>

      </div>

    </div>

    <div id="instructions" hidden>

      <div class="instructions-content">

        <button
          class="close-button"
          onclick="closeInstructions()">
          &times;
        </button>

        <h3>说明书</h3>

        <iframe
          src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/readme.html"
          style="width:100%; height:300px; border:none;">
        </iframe>

      </div>

    </div>

  </div>

  <script>

    function adjustGameUI(){

      const isPortrait =
        window.matchMedia('(max-aspect-ratio: 3.5/4)').matches;

      const outer = document.getElementById("outer");
      const outerSize = outer.getBoundingClientRect();

      const offsetX = outerSize.left;
      const offsetY = outerSize.top;

      const wholeWidth = window.innerWidth - offsetX;
      const wholeHeight = window.innerHeight - offsetY;

      const canvas = document.getElementById("canvas");

      const aspectRatio = canvas.width / canvas.height;

      const noSideButtons =
        WoditorGameSettings.hideSideButtons ||
        WoditorGameSettings.isFullscreen;

      const noHeaderFooter =
        WoditorGameSettings.hideHeaderFooter ||
        WoditorGameSettings.isFullscreen;

      const minButtonWidth =
        (noSideButtons || isPortrait) ? 0 : 200;

      const canvasRate = noHeaderFooter ? 1.0 : 0.9;

      const idealHeight = wholeHeight * canvasRate;

      const idealWidth =
        idealHeight * aspectRatio + minButtonWidth;

      const actualCanvasWidth =
        wholeWidth > idealWidth
          ? idealHeight * aspectRatio
          : wholeWidth - minButtonWidth;

      const actualCanvasHeight =
        actualCanvasWidth / aspectRatio;

      document.getElementById("screen-left").hidden =
        noSideButtons;

      document.getElementById("screen-right").hidden =
        noSideButtons;

      document.getElementById("title-content").hidden =
        noHeaderFooter;

      document.getElementById("main-footer").hidden =
        noHeaderFooter;

      outer.style.width = wholeWidth + "px";
      outer.style.height = wholeHeight + "px";

      canvas.style.width = actualCanvasWidth + "px";
      canvas.style.height = actualCanvasHeight + "px";

      const main = document.getElementById("main");

      main.style.top =
        (wholeHeight - actualCanvasHeight) / 2 + "px";
    }

    function showInstructions() {
      document.getElementById('instructions').hidden = false;
    }

    function closeInstructions() {
      document.getElementById('instructions').hidden = true;
    }

  </script>

  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/gh/formerlegend3323/dev-state@main/assets/public/settings.js">
  </script>

</body>

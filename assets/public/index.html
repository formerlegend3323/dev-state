function load(src, module = false) {

  return new Promise((resolve, reject) => {

    const s = document.createElement("script");

    if (module)
      s.type = "module";

    s.src = src;

    s.onload = () => {
      console.log("loaded", src);
      resolve();
    };

    s.onerror = (e) => {
      console.error("FAILED", src, e);
      reject(e);
    };

    document.head.appendChild(s);

  });

}
